name: Fetch Player Data

on:
  schedule:
    # Run daily at 09:00 UTC (4:00 AM CDT / 3:00 AM CST) to finish well before 7:00 AM Central
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fetch mode'
        required: true
        default: 'full_season'
        type: choice
        options:
          - full_season
          - yesterday
          - custom_date
      custom_date:
        description: 'Custom date (only if mode=custom_date, YYYY-MM-DD)'
        required: false

permissions:
  contents: write

jobs:
  fetch-player-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: "."
    
    steps:
      - name: Check Active Schedule
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "✅ Manual Dispatch Triggered!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            has_games=$(python3 -c "
            import urllib.request, json
            try:
                req = urllib.request.Request('https://api-web.nhle.com/v1/schedule/now', headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=10) as r:
                    data = json.loads(r.read().decode('utf-8'))
                has_games = any(bool(day.get('games')) for day in (data.get('gameWeek') or []))
                print('true' if has_games else 'false')
            except Exception as e:
                print('true')
            " 2>/dev/null || echo "true")
            if [[ "$has_games" == "true" ]]; then
              echo "✅ Active games scheduled in current gameWeek!"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "⏸️ No games scheduled for active week. Skipping run."
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi
        id: check_date
      - name: Checkout repository
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/checkout@v4
        
      - name: Set up Python
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          pip install requests pandas
          
      - name: Fetch player data
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          
          # Default to yesterday for scheduled runs
          if [ -z "$MODE" ]; then
            MODE="yesterday"
          fi
          
          if [ "$MODE" = "full_season" ]; then
            START_YEAR=$(python3 -c "from datetime import datetime; n=datetime.now(); print(n.year if n.month >= 7 else n.year-1)")
            START_DATE="${START_YEAR}-10-01"
            END_DATE=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
            echo "Running full season backfill from $START_DATE to $END_DATE"
            python fetch_player_data.py --start $START_DATE --end $END_DATE
          elif [ "$MODE" = "custom_date" ] && [ -n "${{ github.event.inputs.custom_date }}" ]; then
            echo "Fetching data for custom date: ${{ github.event.inputs.custom_date }}"
            python fetch_player_data.py --date ${{ github.event.inputs.custom_date }}
          else
            echo "Fetching yesterday's games"
            python fetch_player_data.py --yesterday
          fi
          
      - name: Check for changes
        if: steps.check_date.outputs.should_run == 'true'
        id: check_changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push
        if: steps.check_date.outputs.should_run == 'true' && steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Update player data - $(date +'%Y-%m-%d')"
          git push
